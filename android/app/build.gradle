plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Must come after Android & Kotlin
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.pinktrisha.app2025release"

    // Either rely on Flutter's value or pin explicitly.
    // compileSdk = flutter.compileSdkVersion
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "com.pinktrisha.app2025release"
        minSdk = 23
        targetSdk = 34

        // Use Flutter’s version props if present, fallback otherwise.
        versionCode = (project.findProperty("flutter.versionCode") ?: "5").toInteger()
        versionName = (project.findProperty("flutter.versionName") ?: "1.0")

        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            shrinkResources false
            zipAlignEnabled false
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug { }
    }

    compileOptions {
        // Safe with AGP 8.2.2 even if your JDK is 21
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    // Keep if you need it
    configurations.all {
        exclude group: "com.google.android.play", module: "core-common"
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.activity:activity-ktx:1.8.0"
}
